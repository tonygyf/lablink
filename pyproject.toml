[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lablink-launcher"
version = "0.1.0"
description = "A configurable Chinese SSH, VNC and 1Panel launcher"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
lablink = "lablink.cli:main"

[tool.setuptools.packages.find]
include = ["lablink*"]
